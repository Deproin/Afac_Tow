name: Android CI/CD Release & Debug Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Prepare Release Keystore (Auto-Generate on Cloud if Secrets not set)
      run: |
        if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > android_release_key.jks
        else
          keytool -genkeypair -v -keystore android_release_key.jks -alias afaq_key -keyalg RSA -keysize 2048 -validity 10000 -storepass afaq123456 -keypass afaq123456 -dname "CN=Afaq Accountant, OU=Mobile, O=Afaq, L=Sanaa, ST=Sanaa, C=YE"
        fi

    - name: Get SHA-1 Fingerprint
      run: keytool -list -v -keystore android_release_key.jks -alias afaq_key -storepass afaq123456 | grep SHA1

    - name: Build Fast Signed Release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/android_release_key.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'afaq123456' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'afaq_key' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'afaq123456' }}
      run: gradle assembleRelease --no-daemon --build-cache --parallel


    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Afaq Accountant APK - Build ${{ github.run_number }}
        body: "تم بناء هذا الإصدار بنجاح! حمل التطبيق (APK) من قائمة Assets بالأسفل."
        files: app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

